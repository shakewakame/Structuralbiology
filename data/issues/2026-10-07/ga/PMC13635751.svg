<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif"><rect width="1200" height="630" fill="#FFFFFF"/><rect x="24" y="24" width="600" height="582" rx="18" fill="#F3F5F9"/><text text-anchor="middle" x="324.0" y="305.0" font-size="26" font-weight="600" fill="#5A6478">PDB ID は論文の補足資料に記載</text><text text-anchor="middle" x="324.0" y="345.0" font-size="18" font-weight="400" fill="#5A6478">（座標を自動取得できないため構造図なし）</text><text x="664" y="64.0" font-size="17" font-weight="400" fill="#5A6478">構造生物学デイリー（仮）  2026-10-07</text><text x="664" y="128.0" font-size="36" font-weight="700" fill="#1F2A44">PARP2はDNA 2周分をまたいで</text><text x="664" y="175.5" font-size="36" font-weight="700" fill="#1F2A44">切断を捉え、阻害剤はDNA結合</text><text x="664" y="223.0" font-size="36" font-weight="700" fill="#1F2A44">面を固める</text><text x="664" y="298.6" font-size="15" font-weight="400" fill="#5A6478">標的</text><text x="664" y="325.6" font-size="21" font-weight="500" fill="#1F2A44">ヒトPARP2–HPF1／ヌクレオソーム</text><text x="664" y="366.9" font-size="15" font-weight="400" fill="#5A6478">手法・分解能</text><text x="664" y="393.9" font-size="21" font-weight="500" fill="#1F2A44">クライオ電顕・全体 2.8 Å</text><text x="664" y="435.2" font-size="15" font-weight="400" fill="#5A6478">結合分子</text><text x="664" y="462.2" font-size="21" font-weight="500" fill="#1F2A44">オラパリブ、タラゾパリブ、EB-47</text><text x="664" y="503.5" font-size="15" font-weight="400" fill="#5A6478">掲載誌</text><text x="664" y="530.5" font-size="21" font-weight="500" fill="#1F2A44">Nucleic Acids Res（2026-10-05）</text><rect x="664" y="566" width="104" height="32" rx="16" fill="#1F2A44"/><text x="676" y="588" font-size="16" fill="#FFFFFF">機構の解明</text><rect x="778.0" y="566" width="152" height="32" rx="16" fill="#1F2A44"/><text x="790.0" y="588" font-size="16" fill="#FFFFFF">創薬・モダリティ</text><rect x="940.0" y="566" width="92" height="32" rx="16" fill="#1F2A44"/><text x="952.0" y="588" font-size="16" fill="#FFFFFF">実験Tips</text></svg>
